name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0). Leave empty to bump patch from current.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty to auto-generate from commits.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  BINARY_PREFIX: sfs
  LD_FLAGS: "-w -s -X smallFileSync/internal/model.AppVersion="

jobs:
  # ── Determine version, create tag, create release ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          CURRENT="${CURRENT#v}"
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            BASE_VERSION="${CURRENT%%-*}"
            MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
            PATCH=$((10#$PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> New: $VERSION"

      - name: Determine prerelease
        id: prerelease
        run: |
          PRERELEASE="${{ inputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Auto-detect prerelease from version string (-alpha/-beta/-preview/-rc)
          if echo "$VERSION" | grep -qiE '-(alpha|beta|preview|rc)'; then
            PRERELEASE="true"
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
            NOTES=$(printf '## Changes\n\n%s\n\n---\n\n## Install\n\nRun the installer:\n\n```\ncurl -sSL https://github.com/vst93/sfs/releases/latest/download/install.sh | bash\n```\n\nOr download a file for your platform:\n\n| File | Platform |\n|------|----------|\n| `sfs-linux-amd64.zip` | Linux (x86_64) |\n| `sfs-linux-arm64.zip` | Linux (ARM64) |\n| `sfs-darwin-amd64.zip` | macOS (Intel) |\n| `sfs-darwin-arm64.zip` | macOS (Apple Silicon) |\n| `sfs-windows-amd64.zip` | Windows (x86_64) |\n| `sfs-android-arm64.zip` | Android (ARM64) |\n' "$COMMITS")
            NOTES="${NOTES//\$\{VERSION\}/$VERSION}"
          fi
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Tag and push (no v prefix)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.prerelease.outputs.prerelease }}"
          # Decode the percent-encoded notes back to real newlines
          NOTES=$(printf '%b' "${NOTES//%/\\x}")
          EXTRA_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$VERSION" \
            --title "sfs $VERSION" \
            --notes "$NOTES" \
            --target main \
            $EXTRA_ARGS

  # ── Build for each platform ───────────────────────────────────────────────
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: android
            goarch: arm64
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # 设置 Android 交叉编译工具链
          if [ "$GOOS" = "android" ]; then
            export CGO_ENABLED=1
            if [ "$GOARCH" = "arm64" ]; then
              export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android32-clang"
            elif [ "$GOARCH" = "arm" ]; then
              export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi32-clang"
            fi
          else
            export CGO_ENABLED=0
          fi

          # 设置输出文件名
          if [ "$GOOS" = "windows" ]; then
            OUTPUT="${{ env.BINARY_PREFIX }}.exe"
          elif [ "$GOOS" = "android" ]; then
            OUTPUT="${{ env.BINARY_PREFIX }}"
          else
            OUTPUT="${{ env.BINARY_PREFIX }}"
          fi

          go build -ldflags "${{ env.LD_FLAGS }}${VERSION}" -o "$OUTPUT" .

      - name: Create archive
        run: |
          ZIPNAME="${{ env.BINARY_PREFIX }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${ZIPNAME}.zip" "${{ env.BINARY_PREFIX }}.exe"
          elif [ "${{ matrix.goos }}" = "android" ]; then
            zip "${ZIPNAME}.zip" "${{ env.BINARY_PREFIX }}"
          else
            zip "${ZIPNAME}.zip" "${{ env.BINARY_PREFIX }}"
          fi

      - name: Generate SHA256 checksum
        run: |
          ZIPNAME="${{ env.BINARY_PREFIX }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          sha256sum "${ZIPNAME}.zip" | awk '{print $1}' > "${ZIPNAME}.zip.sha256"

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: ${{ env.BINARY_PREFIX }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          fail_on_unmatched_files: false

      - name: Upload SHA256 to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: ${{ env.BINARY_PREFIX }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          fail_on_unmatched_files: false

  # ── Upload install.sh ─────────────────────────────────────────────────────
  upload-install-script:
    name: Upload install.sh
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Upload install.sh to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: cmd/install.sh
          fail_on_unmatched_files: true
